name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check every script
        run: for f in scripts/*.js; do node --check "$f"; done

      - name: Check the language file loads in Foundry
        run: node tools/check-lang.mjs
